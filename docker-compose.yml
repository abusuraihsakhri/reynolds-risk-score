version: '3.8'

services:
  reynolds-risk-score:
    build: .
    container_name: reynolds-risk-score
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:?Set a secure AUDIT_SECRET_KEY before starting the container}
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
