name: Deploy Reynolds calculator to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Browser regression suite
        run: |
          node --check web/risk.js
          node --check web/app.js
          node --test web/risk.test.cjs
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp web/index.html web/risk.js web/app.js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
