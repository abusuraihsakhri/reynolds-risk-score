name: Reynolds Risk Score CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Pytest Suite
      run: |
        python -m compileall -q .
        python -m pytest -v

    - name: Build Python distribution
      run: |
        python -m pip wheel --no-deps --wheel-dir /tmp/reynolds-wheels .

    - name: Validate and test standalone browser application
      run: |
        node --check web/risk.js
        node --check web/app.js
        node --test web/risk.test.cjs

    - name: Security SAST & Zero-PHI Audit
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "
